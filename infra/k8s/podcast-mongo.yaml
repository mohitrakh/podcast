apiVersion: apps/v1
kind: Deployment
metadata:
  name: podcast-mongo-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: podcast-mongo
  template:
    metadata:
      labels:
        app: podcast-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:6
          ports:
            - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: podcast-mongo-srv
spec:
  selector:
    app: podcast-mongo
  ports:
    - port: 27017
      targetPort: 27017